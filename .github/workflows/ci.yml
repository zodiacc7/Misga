name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          ./gradlew testDebugUnitTest 2>&1 | tee -a build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # CI logs are not always reachable from automation, so surface the
      # interesting parts of the Gradle output as check annotations.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            tr -d '\r' < build.log > build-clean.log
            grep -E '^e: |^FAILURE: |What went wrong|Execution failed for task|Could not (resolve|find|open)|Unresolved reference' build-clean.log \
              | head -n 50 \
              | sed 's/%/%25/g' \
              | awk '{ printf "::error::%s\n", $0 }'
          fi
