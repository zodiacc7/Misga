name: Release

on:
  workflow_dispatch:
  push:
    tags:
      # Stable tags (1.0.0) and beta tags (1.1.0-beta.1) both build a signed APK.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$VERSION" == v* ]]; then
            echo "::error::versionName must not include a 'v' prefix (got $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version is $VERSION"

      - name: Ensure git tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          if [[ "${{ github.ref_name }}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Git tag ${{ github.ref_name }} must equal versionName ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Preferred: keystore provided as a secret. Fallback: the checked-in
      # keystore/keystore.properties, so a fresh clone can still publish a signed build.
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE" ]]; then
            echo "$SIGNING_KEYSTORE" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/ramesh-release.p12"
            test -s "$RUNNER_TEMP/ramesh-release.p12"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ramesh-release.p12" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE secret is not set; using keystore/keystore.properties"
            test -f keystore/ramesh-release.p12
          fi

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -f "$UNSIGNED" && ! -f "$SIGNED" ]]; then
            echo "::error::Release APK was not signed. Check signing secrets."
            exit 1
          fi
          test -f "$SIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Prepare release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ramesh-${VERSION}-universal.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Beta builds (1.1.0-beta.1 and friends) are always published as prereleases so
          # that nobody gets them through the "latest release" link.
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release upload "$VERSION" \
            "dist/ramesh-${VERSION}-universal.apk" \
            dist/SHA256SUMS \
            --clobber 2>/dev/null || \
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            $PRERELEASE \
            "dist/ramesh-${VERSION}-universal.apk" \
            dist/SHA256SUMS
